[package]
name = "llm-voice-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight pipeline: text → LLM → VOICEVOX → WAV audio"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"
