[package]
name = "llm-voice-bridge"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Lightweight pipeline: text → LLM → VOICEVOX → WAV audio"
readme = "README.md"
repository = "https://github.com/Umisyo/llm-voice-bridge"
homepage = "https://github.com/Umisyo/llm-voice-bridge"
keywords = ["tts", "voicevox", "llm", "openai", "anthropic"]
categories = ["multimedia::audio", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
futures = "0.3"
pin-project-lite = "0.2"
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"
